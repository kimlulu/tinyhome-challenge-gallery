<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tiny Home Design Challenge — Top 10 Finalists</title>
<style>
@font-face { font-family: Matter; src: url("https://cdn.prod.website-files.com/68da69e18c8988d039a9f6fe/6903b8705cce60bc3d9e254b_Matter-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: Matter; src: url("https://cdn.prod.website-files.com/68da69e18c8988d039a9f6fe/6903b8700a54781b99c62533_Matter-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }

:root{
  --bg:#191919; --surface:#202020; --surface2:#282828; --surface3:#323232;
  --border:#333333; --border2:#444444;
  --bone:#F8F4F1; --text:#F8F4F1; --muted:#8A8A8A; --muted2:#6A6A6A;
  --pin:#F8F4F1; --warn:#E5B567;
  --cols:5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Matter,-apple-system,BlinkMacSystemFont,'Inter',sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}

/* ---------- header ---------- */
.header{position:sticky;top:0;z-index:100;background:rgba(25,25,25,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-name{font-size:15px;font-weight:500;letter-spacing:-0.012em;color:var(--bone)}
.vids{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.vid{position:relative;aspect-ratio:16/9;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:var(--muted);font-size:11.5px;overflow:hidden}
.vid:hover{border-color:var(--border2);color:var(--text)}
.vid svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.brand-sep{width:1px;height:16px;background:var(--border2)}
.brand-title{font-size:13px;font-weight:500;letter-spacing:-0.01em}
.brand-count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.search-wrap{flex:1;min-width:170px;max-width:300px;position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);pointer-events:none}
.search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12.5px;padding:7px 10px 7px 32px;outline:none;transition:border-color .15s}
.search:focus{border-color:var(--border2)}
.search::placeholder{color:var(--muted2)}

.seg{display:flex;gap:2px;background:var(--surface2);border-radius:7px;padding:2px;border:1px solid var(--border)}
.seg button{background:transparent;border:none;border-radius:5px;color:var(--muted);cursor:pointer;padding:5px 12px;font-size:12px;font-weight:500;transition:.12s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bone);color:#191919}
.seg .n{font-size:10px;opacity:.65;font-variant-numeric:tabular-nums}
.seg button.on .n{opacity:.55}

.sel{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;padding:6px 8px;cursor:pointer;outline:none}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--muted);cursor:pointer;padding:6px 11px;font-size:12px;transition:.12s;white-space:nowrap}
.ghost:hover{background:var(--surface3);color:var(--text)}

/* ---------- banner ---------- */
.banner{display:none;margin:0;padding:10px 20px;background:rgba(229,181,103,.1);border-bottom:1px solid rgba(229,181,103,.28);color:var(--warn);font-size:12.5px;line-height:1.5}
.banner.show{display:block}
.banner b{font-weight:500}
.banner code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:3px;font-size:11.5px}

/* ---------- grid ---------- */
.grid{display:grid;gap:14px;padding:18px 20px 60px;grid-template-columns:repeat(var(--cols),1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;transition:transform .14s,border-color .14s}
.card:hover{transform:translateY(-3px);border-color:var(--border2)}
.card.pinned{border-color:rgba(248,244,241,.5)}
.imgwrap{width:100%;aspect-ratio:4/3;background:var(--surface2);position:relative;overflow:hidden;display:block}
.imgwrap img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;opacity:0;transition:opacity .25s}
.imgwrap img.ok{opacity:1}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted2);font-size:11px;text-align:center;padding:10px;z-index:0}
.ph .ini{font-size:22px;font-weight:500;color:rgba(248,244,241,.22);letter-spacing:.5px}

.num{position:absolute;top:8px;left:8px;z-index:4;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);color:var(--bone);font-size:11px;font-weight:500;padding:3px 7px;border-radius:5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.imgn{position:absolute;bottom:8px;right:8px;z-index:4;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);color:rgba(248,244,241,.85);font-size:10.5px;font-weight:500;padding:3px 7px;border-radius:12px;display:flex;align-items:center;gap:4px}
.imgn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.dupe{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(229,181,103,.9);color:#191919;font-size:9.5px;font-weight:500;padding:2px 7px;border-radius:4px;letter-spacing:.03em;text-transform:uppercase}

.pin{position:absolute;top:7px;right:7px;z-index:5;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);border:none;border-radius:50%;width:29px;height:29px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.14s}
.card:hover .pin,.pin.on{opacity:1}
.pin:hover{background:rgba(0,0,0,.82);transform:scale(1.1)}
.pin svg{width:15px;height:15px;fill:none;stroke:rgba(248,244,241,.85);stroke-width:1.8}
.pin.on{background:var(--bone)}
.pin.on svg{fill:#191919;stroke:#191919}

.meta{padding:9px 11px 10px;border-top:1px solid var(--border)}
.c-ti{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.c-nm{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted);font-size:13px}

/* ---------- lightbox ---------- */
.lb{display:none;position:fixed;inset:0;z-index:1000;background:rgba(10,10,10,.93);backdrop-filter:blur(10px)}
.lb.open{display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);flex:none}
.lb-num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lb-h{min-width:0;flex:1}
.lb-ti{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-nm{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-acts{display:flex;gap:7px;align-items:center;flex:none}
.pinbtn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--muted);cursor:pointer;padding:6px 12px;font-size:12px;transition:.14s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pinbtn:hover{background:var(--surface3);color:var(--text)}
.pinbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.pinbtn.on{background:var(--bone);border-color:var(--bone);color:#191919}
.pinbtn.on svg{fill:#191919;stroke:#191919}
.x{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--muted);cursor:pointer;width:30px;height:30px;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.14s}
.x:hover{background:var(--surface3);color:var(--text)}

.lb-body{flex:1;display:flex;min-height:0;overflow:hidden}
@media (max-width:1000px){.lb-body{flex-direction:column;overflow-y:auto}}

.stage-col{flex:1;display:flex;flex-direction:column;min-width:0;background:#0d0d0d}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
@media (max-width:1000px){.stage{min-height:58vh}}
.stage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;opacity:0;transition:opacity .2s}
.stage img.ok{opacity:1}
.stage-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted2);font-size:12.5px;text-align:center;padding:24px;line-height:1.6}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:50%;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--bone);transition:.14s}
.arrow:hover{background:rgba(0,0,0,.8);border-color:rgba(255,255,255,.3)}
.arrow:disabled{opacity:.25;cursor:default}
.arrow.l{left:14px} .arrow.r{right:14px}
.arrow svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.cat{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:rgba(248,244,241,.9);font-size:11px;font-weight:500;padding:4px 11px;border-radius:14px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.cat span{color:var(--muted);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}

.strip{flex:none;display:flex;gap:7px;padding:10px 14px;overflow-x:auto;border-top:1px solid var(--border);background:var(--bg)}
.strip::-webkit-scrollbar{height:6px}
.strip::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
.th{flex:none;width:64px;height:48px;border-radius:5px;overflow:hidden;cursor:pointer;background:var(--surface2);border:2px solid transparent;position:relative;transition:.12s}
.th.on{border-color:var(--bone)}
.th:hover{border-color:var(--border2)}
.th.on:hover{border-color:var(--bone)}
.th img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.th img.ok{opacity:1}
.th .tn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted2)}

.side{width:390px;flex:none;overflow-y:auto;padding:20px 22px 28px;background:var(--bg);border-left:1px solid var(--border)}
@media (max-width:1000px){.side{width:100%;border-left:none;border-top:1px solid var(--border)}}
.lab{font-size:10.5px;font-weight:500;color:var(--muted2);text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px}
.lab:not(:first-child){margin-top:24px}
.desc{font-size:13px;line-height:1.75;white-space:pre-wrap;color:rgba(248,244,241,.9)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px}
.facts dt{color:var(--muted2)}
.facts dd{color:rgba(248,244,241,.9);word-break:break-word}
.lnk{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);text-decoration:none;padding:7px 12px;font-size:12px;transition:.14s;margin:0 6px 6px 0}
.lnk:hover{background:var(--surface3);border-color:var(--border2)}
.lnk svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}

.lb-bot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--border);background:var(--bg)}
.navb{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);cursor:pointer;padding:7px 14px;font-size:12.5px;transition:.14s}
.navb:hover{background:var(--surface3)}
.navb:disabled{opacity:.3;cursor:default}
.keys{font-size:11px;color:var(--muted2);display:flex;gap:14px;flex-wrap:wrap}
.keys kbd{background:var(--surface2);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-family:inherit;font-size:10.5px;color:var(--muted)}
@media (max-width:760px){.keys{display:none}}

.zoom{display:none;position:fixed;inset:0;z-index:2000;background:rgba(8,8,8,.97);align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.zoom.open{display:flex}
.zoom img{max-width:98vw;max-height:96vh;object-fit:contain}

@media (max-width:1500px){:root{--cols:4}}
@media (max-width:1100px){:root{--cols:3}}
@media (max-width:760px){:root{--cols:2};.grid{padding:14px;gap:10px}.header{padding:10px 14px;gap:10px}}
@media (max-width:640px){.lb-top{flex-wrap:wrap}.lb-h{order:3;flex:1 0 100%}.lb-ti,.lb-nm{white-space:normal}.lb-num{order:1}.lb-acts{order:2;margin-left:auto}}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span class="brand-name">Vizcom</span>
    <div class="brand-sep"></div>
    <span class="brand-title">Tiny Home Design Challenge · Top 10 Finalists</span>
  </div>
  <span class="brand-count" id="count">—</span>

  <div class="search-wrap">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search" id="q" type="text" placeholder="Search title, designer, description…" oninput="refresh()">
  </div>

  <div class="seg">
    <button id="t-all" class="on" onclick="setTab('all')">All <span class="n" id="n-all">0</span></button>
    <button id="t-pin" onclick="setTab('pin')">Pinned <span class="n" id="n-pin">0</span></button>
  </div>

  <div class="right">
    <select class="sel" id="sort" onchange="refresh()">
      <option value="num">Finalist order</option>
      <option value="new">Newest first</option>
      <option value="name">Designer A–Z</option>
      <option value="title">Title A–Z</option>
    </select>
    <div class="seg">
      <button onclick="setCols(7,this)">S</button>
      <button class="on" onclick="setCols(5,this)">M</button>
      <button onclick="setCols(3,this)">L</button>
    </div>
    <button class="ghost" onclick="exportPins()">Export pinned</button>
  </div>
</div>

<div class="banner" id="banner"></div>
<div class="grid" id="grid"></div>

<div class="lb" id="lb"></div>
<div class="zoom" id="zoom" onclick="this.classList.remove('open')"><img id="zoomimg" src="" alt=""></div>

H-01 is a field station on the Holuhraun lava field, in Iceland’s northeastern Highlands, for a volcanologist who spends weeks alone monitoring the Bárðarbunga volcanic system, inspired by pioneering field volcanologists like Katia Krafft and the spirit of 1970s volcano expeditions. Every decision answers the site: a faceted, bright-yellow corrugated steel shell sheds wind and ash and works as a beacon in fog and ash storms, splayed legs with ski feet lift it off frozen rock and geothermal heat and let it be relocated if seismic activity shifts, and a solar roof and pellet stove keep it fully off-grid. Inside, about 130 sq ft of plywood follows every facet, with a pellet stove by the door, a low bed beside a small window, a kitchen and composting toilet sharing one wet wall, and a fold-down desk beneath the large hexagonal window, where she watches the volcano by day and, at night, the glowing window becomes the only warm light in the landscape.","ro":"Industrial or product designer","uv":"A little","d3":"Yes","so":"https://www.instagram.com/luuciaamolinaa_?vrfl=djYyc29jN3B2M2E%3D&utm_source=qr","vz":"https://app.vizcom.com/workbench/4bc9f429-e7de-4f3c-8bd7-70b5b10b3e4c#sharing_secret=1d640bdd-72c5-4c68-b7f0-4bc492fe9632","ts":"11/15/2026 15:41:37","im":[{"id":"1wOK6YFNDkc7U3H3zx3GNh5rkbGBQ6tQE","c":"Hero"},{"id":"18LFAxai3nhclCFlBhyH-M5ADrTKnYcIp","c":"Elevations"},{"id":"1GGT34k6eLYgSOxRPYrkz65ezEJmXZw8L","c":"Elevations"},{"id":"1w_clrPPgqx-RhGN8Ksy2mGPDVyUnF55O","c":"Elevations"},{"id":"1xkPostaQGa0JVfJSsmTt5CWt6bLXlfjR","c":"Interior"},{"id":"1Tgdy7dEr0FabpTr7WN2hgrmrFde-HGBx","c":"Entourage"}],"an":["15RsALz_Gl_pK-O-oRRQZ6BFLZHefIEwr","13fOGWyHO2S8mTFdrRuodBU4Sw8l-IQsn"],"or":106,"hb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAACMKADAAQAAAABAAACMAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgCMAIwAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAA re fewer hands left to hold the ropes.\n\nI designed a home that lets him stay: three woven-bamboo hexagonal cells hung beneath a rock overhang the way the bees hang their own comb. The rock is his roof. The porch is where he mends the ropes that other men’s lives hang from. A rope bridge crosses to the neighbor whose home hangs facing his, so no one on the cliff has to grow old alone.\n\nThey build where the bees build, on land no one can farm, so the knowledge stays on the cliff instead of leaving with the next generation.","ro":"Design student","uv":"Yes","d3":"Yes","so":"@madhav.id","vz":"https://app.vizcom.com/workbench/023e8c6a-5dde-4838-b903-9828e94580b1#sharing_secret=313bed0c-79d0-41ba-b636-f9356feb9ee5","ts":"11/7/2026 8:49:29","im":[{"id":"1BvfbONekukSyKD0aJ_MvsBHafoj_1O01","c":"Hero"},{"id":"1uQbl8Smv3-dBptbwY_IDErk12U1mTVwR","c":"Elevations"},{"id":"1v8kClnxlXQNJCkTM3TZPSVgnzciTOraG","c":"Elevations"},{"id":"18e3oQS-_sj2rcLBe21v3QRJPTfPaapNa","c":"Elevations"},{"id":"1rfqu9mS5VMIq99F_htmkUTitC--rZHtn","c":"Elevations"},{"id":"1IR8Z9fvoOfWDMrBMCmwsKNJtnJJvojdS","c":"Interior"},{"id":"15ek8oFmH2wmNpoy-5BlKby6R9sUV8McA","c":"Entourage"}],"an":["1JkX4wqgaM1-OXq5EgLXRak43tgQGwzbt","1As7Sc6CWC7haEP_bo_6_h5GhKyeDiyyb","1GAJJlafd-BEMfliQCNkQFjMDSCW3pJql"],"or":19,"hb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAACMKADAAQAAAABAAACMAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgCMAIwAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSl /* ---------------- image loading ---------------- */
/* Drive-hosted images. Each id is tried against several Drive endpoints in
   order; if all fail we fall back to a labelled placeholder and (for hero
   images) raise the "images aren't loading" banner. */
function srcs(id, w) {
  return [
    'https://lh3.googleusercontent.com/d/' + id + '=w' + w,
    'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + w,
    'https://lh3.googleusercontent.com/d/' + id
  ];
}

var heroOk = 0, heroFailed = 0, bannerShown = false;

/* Show the banner only when we are sure: several hero images have exhausted
   every Drive endpoint and not one hero anywhere on the page has loaded. */
function checkBanner() {
  if (bannerShown || heroOk > 0) return;
  if (heroFailed >= 6 && !queue.length && inflight <= 1) {
    bannerShown = true;
    document.getElementById('banner').className = 'banner show';
    document.getElementById('banner').innerHTML =
      '<b>Images aren’t loading.</b> The submission files in Google Drive are still set to <b>Private</b>, ' +
      'so this page can’t display them. Open the Drive folder that Google Forms created for this form ' +
      '(<code>Vizcom Tiny Home Design Challenge Submission Form (File responses)</code>), set it to ' +
      '<b>Anyone with the link → Viewer</b>, then reload this page. Nothing else needs to change.';
  }
}

/* Attach an image with a fallback chain. */
/* Google's Drive thumbnailer silently stalls a burst of ~30+ parallel
   requests from one client: the connections stay open and the images never
   arrive. So grid images go through a small queue (6 at a time) with a stall
   timeout, and only lightbox images - which the reviewer is waiting on - skip
   the queue. */
var MAXQ = 6, inflight = 0, queue = [];
function pump() {
  while (inflight < MAXQ && queue.length) { inflight++; queue.shift()(); }
}
function release(state) {
  if (state.released) return;
  state.released = true;
  if (state.queued) { inflight--; pump(); }
}

function load(img, id, w, isHero, fb, queued) {
  var list = srcs(id, w);
  if (fb) list.push(fb);
  var i = 0, timer = null;
  var state = { queued: !!queued, released: false };
  img.referrerPolicy = 'no-referrer';

  function clear() { if (timer) { clearTimeout(timer); timer = null; } }

  function fail() {
    clear();
    i++;
    if (i < list.length) { attempt(); return; }
    img.onload = img.onerror = null;
    img.removeAttribute('src');
    if (isHero) { heroFailed++; checkBanner(); }
    release(state);
  }

  function attempt() {
    clear();
    /* If a source has produced nothing after 20s it is stalled, not slow -
       drop it and try the next endpoint rather than holding the slot open. */
    timer = setTimeout(fail, 20000);
    img.src = list[i];
  }

  img.onload = function () {
    if (!img.naturalWidth) { fail(); return; }
    clear();
    if (isHero) {
      heroOk++;
      if (bannerShown) {
        bannerShown = false;
        document.getElementById('banner').className = 'banner';
      }
    }
    img.className = (img.className.replace(/\bok\b/, '') + ' ok').trim();
    release(state);
  };
  img.onerror = fail;

  if (queued) { queue.push(attempt); pump(); } else { attempt(); }
}

/* ---------------- state ---------------- */
var PIN_KEY = 'vizcom-tinyhome-pinned';

/* Pins are stored two ways, because this page is usually opened straight from
   disk (file://) where browsers often block localStorage entirely:
     1. localStorage, when the browser allows it;
     2. the URL hash, which always works - so a reload, a bookmark, or sending
        someone the URL keeps the shortlist intact.
   Every read and write is guarded; the page must render either way. */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function readPins() {
  var fromHash = (location.hash || '').replace(/^#/, '');
  if (/^pins=/.test(fromHash)) {
    var nums = fromHash.slice(5).split(',').filter(Boolean).map(Number).filter(function (n) { return n > 0; });
    if (nums.length) return new Set(nums);
  }
  try { return new Set(JSON.parse(lsGet(PIN_KEY) || '[]')); } catch (e) { return new Set(); }
}

var pinned = readPins();
var tab = 'all', view = [], cur = 0, slide = 0;

function savePins() {
  var arr = Array.from(pinned).sort(function (a, b) { return a - b; });
  lsSet(PIN_KEY, JSON.stringify(arr));
  var frag = arr.length ? 'pins=' + arr.join(',') : '';
  try {
    history.replaceState(null, '', location.pathname + location.search + (frag ? '#' + frag : ''));
  } catch (e) {
    try { if (location.hash.replace(/^#/, '') !== frag) location.hash = frag; } catch (e2) {}
  }
  document.getElementById('n-pin').textContent = pinned.size;
}
function togglePin(n, e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  if (pinned.has(n)) pinned.delete(n); else pinned.add(n);
  savePins();
  refresh();
  if (document.getElementById('lb').classList.contains('open')) drawLb();
}
function setTab(t) {
  tab = t;
  document.getElementById('t-all').className = t === 'all' ? 'on' : '';
  document.getElementById('t-pin').className = t === 'pin' ? 'on' : '';
  refresh();
}
function setCols(n, el) {
  document.documentElement.style.setProperty('--cols', n);
  var sibs = el.parentNode.children;
  for (var i = 0; i < sibs.length; i++) sibs[i].className = '';
  el.className = 'on';
}
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function initials(nm) {
  return nm.split(/\s+/).slice(0, 2).map(function (w) { return w[0] || ''; }).join('').toUpperCase();
}

/* ---------------- grid ---------------- */
function refresh() {
  queue.length = 0;
  var q = document.getElementById('q').value.trim().toLowerCase();
  var sort = document.getElementById('sort').value;

  view = CARDS.filter(function (c) {
    if (tab === 'pin' && !pinned.has(c.n)) return false;
    if (!q) return true;
    return (c.ti + ' ' + c.nm + ' ' + c.ds + ' ' + c.ro).toLowerCase().indexOf(q) >= 0;
  });

  view.sort(function (a, b) {
    if (sort === 'new') return b.n - a.n;
    if (sort === 'name') return a.nm.localeCompare(b.nm);
    if (sort === 'title') return a.ti.localeCompare(b.ti);
    return a.n - b.n;
  });

  document.getElementById('n-all').textContent = CARDS.length;
  document.getElementById('n-pin').textContent = pinned.size;
  var lbl = view.length === CARDS.length
    ? CARDS.length + ' submissions'
    : view.length + ' of ' + CARDS.length;
  document.getElementById('count').textContent = tab === 'pin' && !q
    ? pinned.size + ' pinned' : lbl;

  draw();
}

function draw() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  if (!view.length) {
    g.innerHTML = '<div class="empty">' +
      (tab === 'pin' ? 'Nothing pinned yet. Hover a card and tap the pin to shortlist it.'
                     : 'No submissions match that search.') + '</div>';
    return;
  }
  var frag = document.createDocumentFragment();

  view.forEach(function (c, idx) {
    var el = document.createElement('div');
    el.className = 'card' + (pinned.has(c.n) ? ' pinned' : '');
    el.onclick = function () { openLb(idx); };

    var wrap = document.createElement('div');
    wrap.className = 'imgwrap';

    var ph = document.createElement('div');
    ph.className = 'ph';
    ph.innerHTML = '<div class="ini">' + esc(initials(c.nm)) + '</div><div>' +
      (c.x ? 'broken upload' : 'image unavailable') + '</div>';
    wrap.appendChild(ph);

    var hero = c.im.filter(function (i) { return i.c === 'Hero'; })[0] || c.im[0];
    if (hero) {
      var img = document.createElement('img');
      img.alt = c.ti;
      /* First two rows load eagerly so the page is never blank on open. */
      img.loading = idx < 24 ? 'eager' : 'lazy';
      if (idx < 12) img.setAttribute('fetchpriority', 'high');
      wrap.appendChild(img);
      /* Hero thumbnails are embedded in this file, so the grid fills the
         moment the page opens - no network, nothing to rate-limit. Full-size
         images still stream from Drive inside the lightbox. */
      if (c.hb) {
        img.referrerPolicy = 'no-referrer';
        img.onload = function () { heroOk++; img.className = (img.className.replace(/\bok\b/, '') + ' ok').trim(); };
        img.onerror = function () { heroFailed++; };
        img.src = c.hb;
      } else {
        load(img, hero.id, 600, true, hero.fb, true);
      }
    }

    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = '#' + c.n;
    wrap.appendChild(num);

    if (c.x) {
      var bx = document.createElement('div');
      bx.className = 'dupe';
      bx.textContent = 'broken file';
      bx.title = c.x;
      wrap.appendChild(bx);
    }

    if (c.rs) {
      var dp = document.createElement('div');
      dp.className = 'dupe';
      dp.textContent = 'deduped';
      dp.title = c.rs;
      wrap.appendChild(dp);
    }

    var cnt = document.createElement('div');
    cnt.className = 'imgn';
    cnt.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/>' +
      '<circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>' + c.im.length +
      (c.an.length ? ' + ' + c.an.length + ' vid' : '');
    wrap.appendChild(cnt);

    var pb = document.createElement('button');
    pb.className = 'pin' + (pinned.has(c.n) ? ' on' : '');
    pb.title = 'Pin to shortlist';
    pb.innerHTML = PIN_SVG;
    pb.onclick = function (e) { togglePin(c.n, e); };
    wrap.appendChild(pb);

    el.appendChild(wrap);

    var m = document.createElement('div');
    m.className = 'meta';
    m.innerHTML = '<div class="c-ti">' + esc(c.ti) + '</div><div class="c-nm">' + esc(c.nm) + '</div>';
    el.appendChild(m);

    frag.appendChild(el);
  });

  g.appendChild(frag);
}

var PIN_SVG = '<svg viewBox="0 0 24 24"><path d="M12 17v5M9 2h6l-1 6 3.5 3.5a1 1 0 0 1-.7 1.7H6.2a1 1 0 0 1-.7-1.7L9 8z" stroke-linejoin="round"/></svg>';
var ARR_L = '<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ARR_R = '<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var PLAY = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor" stroke="none"/></svg>';

/* Animations live in Drive; embedding on click keeps opening a card instant
   and avoids spinning up three video players nobody asked for. */
function playVid(el, id) {
  el.innerHTML = '<iframe src="https://drive.google.com/file/d/' + id +
    '/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>';
  el.style.cursor = 'default';
}

var EXT = '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------------- lightbox ---------------- */
function openLb(i) {
  cur = i; slide = 0;
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
  drawLb();
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}
function goCard(d) {
  var n = cur + d;
  if (n < 0 || n >= view.length) return;
  cur = n; slide = 0; drawLb();
}
function goSlide(d) {
  var c = view[cur], n = slide + d;
  if (n < 0 || n >= c.im.length) return;
  slide = n; drawLb();
}
function setSlide(i) { slide = i; drawLb(); }

function drawLb() {
  var c = view[cur];
  var isPinned = pinned.has(c.n);
  var im = c.im[slide];

  var links = '';
  if (c.vz) {
    var u = c.vz.indexOf('http') === 0 ? c.vz : 'https://' + c.vz;
    links += '<a class="lnk" href="' + esc(u) + '" target="_blank" rel="noreferrer">' + EXT + ' Vizcom project</a>';
  }
  if (c.so && c.so.indexOf('http') === 0) {
    links += '<a class="lnk" href="' + esc(c.so) + '" target="_blank" rel="noreferrer">' + EXT + ' Social</a>';
  }
  c.an.forEach(function (a, i) {
    links += '<a class="lnk" href="https://drive.google.com/file/d/' + a + '/view" target="_blank" rel="noreferrer">' +
      EXT + ' Animation' + (c.an.length > 1 ? ' ' + (i + 1) : '') + '</a>';
  });

  var social = c.so && c.so.indexOf('http') !== 0 ? '<dt>Social</dt><dd>' + esc(c.so) + '</dd>' : '';

  document.getElementById('lb').innerHTML =
  '<div class="lb-top">' +
    '<span class="lb-num">#' + c.n + ' &middot; ' + (cur + 1) + ' of ' + view.length + '</span>' +
    '<div class="lb-h"><div class="lb-ti">' + esc(c.ti) + '</div><div class="lb-nm">' + esc(c.nm) +
      (c.ro ? ' &middot; ' + esc(c.ro) : '') + '</div></div>' +
    '<div class="lb-acts">' +
      '<button class="pinbtn' + (isPinned ? ' on' : '') + '" onclick="togglePin(' + c.n + ',event)">' +
        PIN_SVG + (isPinned ? 'Pinned' : 'Pin') + '</button>' +
      '<button class="x" onclick="closeLb()">&times;</button>' +
    '</div>' +
  '</div>' +

  '<div class="lb-body">' +
    '<div class="stage-col">' +
      '<div class="stage" id="stage">' +
        '<div class="stage-ph" id="stage-ph">Loading image…</div>' +
        '<div class="cat">' + esc(im ? im.c : '—') +
          '<span>' + (c.im.length ? (slide + 1) + ' / ' + c.im.length : '0') + '</span></div>' +
        '<button class="arrow l" onclick="goSlide(-1)"' + (slide === 0 ? ' disabled' : '') + '>' + ARR_L + '</button>' +
        '<button class="arrow r" onclick="goSlide(1)"' + (slide >= c.im.length - 1 ? ' disabled' : '') + '>' + ARR_R + '</button>' +
      '</div>' +
      '<div class="strip" id="strip"></div>' +
    '</div>' +

    '<div class="side">' +
      (c.x ? '<div class="lab">Problem with this submission</div>' +
             '<div class="desc" style="color:var(--warn)">' + esc(c.x) + '</div>' : '') +
      (c.an.length ? '<div class="lab">Animation</div><div class="vids">' +
        c.an.map(function (a, i) {
          return '<div class="vid" onclick="playVid(this,\'' + a + '\')">' + PLAY +
                 '<span>Play animation' + (c.an.length > 1 ? ' ' + (i + 1) : '') + '</span></div>';
        }).join('') + '</div>' : '') +
      '<div class="lab">Design description</div>' +
      '<div class="desc">' + esc(c.ds || '—') + '</div>' +
      (links ? '<div class="lab">Links</div><div>' + links + '</div>' : '') +
      '<div class="lab">Submission</div>' +
      '<dl class="facts">' +
        '<dt>Finalist</dt><dd>#' + c.n + ' of 10</dd>' +
        '<dt>Designer</dt><dd>' + esc(c.nm) + '</dd>' +
        (c.ro ? '<dt>Describes as</dt><dd>' + esc(c.ro) + '</dd>' : '') +
        (c.em ? '<dt>Email</dt><dd>' + esc(c.em) + '</dd>' : '') +
        social +
        '<dt>Used Vizcom before</dt><dd>' + esc(c.uv || '—') + '</dd>' +
        '<dt>Vizcom 3D model</dt><dd>' + esc(c.d3 || '—') + '</dd>' +
        '<dt>Images</dt><dd>' + c.im.length + (c.an.length ? ' + ' + c.an.length + ' animation' : '') + '</dd>' +
        '<dt>Submitted</dt><dd>' + esc(c.ts) + '</dd>' +
        '<dt>Full gallery</dt><dd><a class="lnk" style="display:inline-flex" href="https://kimlulu.github.io/tinyhome-challenge-gallery/#pins=' + c.or + '" target="_blank" rel="noreferrer">Entry #' + c.or + ' of 185</a></dd>' +
        (c.rs ? '<dt>Deduped</dt><dd>' + esc(c.rs) + '</dd>' : '') +
      '</dl>' +
    '</div>' +
  '</div>' +

  '<div class="lb-bot">' +
    '<button class="navb" onclick="goCard(-1)"' + (cur === 0 ? ' disabled' : '') + '>&larr; Previous</button>' +
    '<div class="keys">' +
      '<span><kbd>&larr;</kbd><kbd>&rarr;</kbd> images</span>' +
      '<span><kbd>[</kbd><kbd>]</kbd> submissions</span>' +
      '<span><kbd>P</kbd> pin</span>' +
      '<span><kbd>Esc</kbd> close</span>' +
    '</div>' +
    '<button class="navb" onclick="goCard(1)"' + (cur >= view.length - 1 ? ' disabled' : '') + '>Next &rarr;</button>' +
  '</div>';

  /* main stage image */
  if (im) {
    var big = document.createElement('img');
    big.alt = c.ti;
    big.onclick = function () {
      document.getElementById('zoomimg').src = big.src;
      document.getElementById('zoom').classList.add('open');
    };
    document.getElementById('stage').appendChild(big);
    var ph = document.getElementById('stage-ph');
    var done = false;
    big.addEventListener('load', function () { if (big.naturalWidth && !done) { done = true; ph.style.display = 'none'; } });
    load(big, im.id, 1600, false, im.fb);
    setTimeout(function () {
      if (!done && !big.getAttribute('src')) {
        ph.innerHTML = (c.x ? esc(c.x) : 'This image could not be loaded from Google Drive.') + '<br>' +
          '<a class="lnk" style="margin-top:10px" href="https://drive.google.com/file/d/' + im.id +
          '/view" target="_blank" rel="noreferrer">' + EXT + ' Open in Drive</a>';
      }
    }, 4000);
  }

  /* thumbnail strip */
  var strip = document.getElementById('strip');
  c.im.forEach(function (it, i) {
    var t = document.createElement('div');
    t.className = 'th' + (i === slide ? ' on' : '');
    t.title = it.c;
    t.onclick = function () { setSlide(i); };
    t.innerHTML = '<div class="tn">' + esc(it.c.slice(0, 4)) + '</div>';
    var ti = document.createElement('img');
    ti.alt = it.c;
    ti.loading = 'lazy';
    t.appendChild(ti);
    load(ti, it.id, 160, false, it.fb, true);
    strip.appendChild(t);
  });
  var on = strip.querySelector('.th.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* ---------------- keyboard ---------------- */
document.addEventListener('keydown', function (e) {
  var z = document.getElementById('zoom');
  if (z.classList.contains('open')) {
    if (e.key === 'Escape') z.classList.remove('open');
    return;
  }
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goSlide(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goSlide(1); }
  else if (e.key === '[') goCard(-1);
  else if (e.key === ']') goCard(1);
  else if (e.key === 'p' || e.key === 'P') togglePin(view[cur].n);
});

/* ---------------- export ---------------- */
function exportPins() {
  if (!pinned.size) { alert('Nothing pinned yet.'); return; }
  var rows = [['#', 'Title', 'Designer', 'Email', 'Vizcom project', 'Submitted']];
  CARDS.filter(function (c) { return pinned.has(c.n); })
    .sort(function (a, b) { return a.n - b.n; })
    .forEach(function (c) { rows.push([c.n, c.ti, c.nm, c.em || '', c.vz, c.ts]); });
  var csv = rows.map(function (r) {
    return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'tinyhome-top10.csv';
  a.click();
}

/* ---------------- go ---------------- */
savePins();
refresh();
</script>
